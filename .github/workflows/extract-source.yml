
name: Extract Theos Compiler Source

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p /tmp/source
          unzip -q telegram-theos-compiler.zip -d /tmp/source
          SOURCE="/tmp/source/telegram-theos-compiler"
          test -f "$SOURCE/README.md"
          cp -R "$SOURCE/." .
          mkdir -p /tmp/theos-files
          cp -R scripts README.md /tmp/theos-files/
          mkdir -p extracted-compiler
          cp -R /tmp/theos-files/. extracted-compiler/
          rm -rf scripts
          rm -f README.md

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted-compiler
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted compiler source"
            git push
          fi
