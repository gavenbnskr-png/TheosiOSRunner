
name: Extract Theos Compiler Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract compiler source
        run: |
          set -e

          ZIP_FILE="telegram-theos-compiler.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Compiler ZIP not found at repository root."
            exit 1
          fi

          mkdir -p /tmp/theos-source
          unzip -q "$ZIP_FILE" -d /tmp/theos-source

          SOURCE_DIR="/tmp/theos-source/telegram-theos-compiler"

          if [ ! -f "$SOURCE_DIR/README.md" ]; then
            echo "Expected source folder was not found."
            find /tmp/theos-source -maxdepth 3 -type f
            exit 1
          fi

          cp -R "$SOURCE_DIR/." .

          test -f scripts/poll_telegram.py
          test -f scripts/build_theos.sh
          test -f .github/workflows/telegram-theos.yml

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md scripts .github/workflows/telegram-theos.yml

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add Telegram Theos compiler source"
            git push
          fi
